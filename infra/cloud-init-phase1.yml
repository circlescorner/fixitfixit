#cloud-config
# Phase 1 Cloud-Init: Hybrid Security Bootstrap
# - Starts with ports 80/443 BLOCKED (secure by default)
# - User unlocks for 2 hours via systemd service
# - Setup wizard requires random token (retrieved via DO Console)
# - After setup completes, system stays unlocked with Authelia protection

package_update: true
package_upgrade: true

packages:
  - docker.io
  - docker-compose-v2
  - curl
  - jq
  - git
  - net-tools
  - ufw
  - python3-pip
  - python3-venv

write_files:
  # ---- Setup token (random 32-char hex) ----
  - path: /opt/sandbox/generate-token.sh
    permissions: '0700'
    content: |
      #!/bin/bash
      # Generate cryptographically random setup token
      openssl rand -hex 16 > /opt/sandbox/setup-token.txt
      chmod 600 /opt/sandbox/setup-token.txt
      echo "Setup token generated at /opt/sandbox/setup-token.txt"

  # ---- Time-limited unlock service ----
  - path: /etc/systemd/system/setup-unlock.service
    content: |
      [Unit]
      Description=Unlock ports 80/443 for setup (2 hours)
      After=network.target

      [Service]
      Type=oneshot
      ExecStart=/usr/local/bin/setup-unlock.sh
      RemainAfterExit=yes

      [Install]
      WantedBy=multi-user.target

  - path: /usr/local/bin/setup-unlock.sh
    permissions: '0755'
    content: |
      #!/bin/bash
      set -e
      
      echo "Unlocking ports 80/443 for 2 hours..."
      
      # Allow web traffic
      ufw allow 80/tcp
      ufw allow 443/tcp
      ufw reload
      
      # Set expiration time (2 hours from now)
      date -d "+2 hours" --iso-8601=seconds > /opt/sandbox/unlock-expires-at.txt
      
      echo "Ports unlocked until $(cat /opt/sandbox/unlock-expires-at.txt)"
      echo "Complete setup at https://circlescorner.xyz before this time"
      
      # Schedule auto-lock (safety net if setup not completed)
      # This is optional - once Authelia is protecting the site, we don't auto-lock
      # But this ensures if setup fails, we re-lock after 2 hours
      (sleep 7200 && /usr/local/bin/setup-relock.sh) &
      echo $! > /opt/sandbox/relock-pid.txt

  - path: /usr/local/bin/setup-relock.sh
    permissions: '0755'
    content: |
      #!/bin/bash
      # Only re-lock if setup wizard is still enabled
      # If setup completed, Authelia is protecting the site
      if [ -f /opt/sandbox/setup-token.txt ]; then
        echo "Setup not completed - re-locking ports 80/443"
        ufw delete allow 80/tcp
        ufw delete allow 443/tcp
        ufw reload
        echo "Ports re-locked. Use DO Console to unlock again if needed."
      else
        echo "Setup completed - keeping ports open (protected by Authelia)"
      fi

  # ---- Caddyfile (reverse proxy + auto HTTPS) ----
  - path: /opt/sandbox/caddy/Caddyfile
    content: |
      {
        email your-email@example.com
      }

      circlescorner.xyz {
        # Setup wizard (only active if token file exists)
        @setup_active {
          path /setup*
          file {
            try_files /opt/sandbox/setup-token.txt
          }
        }
        
        # Authelia portal
        route /authelia/* {
          reverse_proxy authelia:9091
        }

        # Auth verification endpoint (internal)
        route /api/authz/* {
          reverse_proxy authelia:9091
        }

        # Dashboard — protected by Authelia (or setup wizard if active)
        route /* {
          forward_auth authelia:9091 {
            uri /api/authz/forward-auth
            copy_headers Remote-User Remote-Groups Remote-Name Remote-Email
          }
          reverse_proxy dashboard:8000
        }
      }

      # Wildcard for future subdomains
      *.circlescorner.xyz {
        forward_auth authelia:9091 {
          uri /api/authz/forward-auth
          copy_headers Remote-User Remote-Groups Remote-Name Remote-Email
        }
        reverse_proxy dashboard:8000
      }

  # ---- Authelia configuration ----
  - path: /opt/sandbox/authelia/configuration.yml
    content: |
      theme: dark
      server:
        address: 'tcp://:9091'

      log:
        level: info

      totp:
        issuer: circlescorner.xyz
        period: 30
        skew: 1

      # WebAuthn (Face ID) configuration
      webauthn:
        disable: false
        display_name: CirclesCorner
        attestation_conveyance_preference: indirect
        user_verification: preferred
        timeout: 60s

      authentication_backend:
        file:
          path: /config/users.yml
          password:
            algorithm: argon2id
            iterations: 3
            memory: 65536
            parallelism: 4
            salt_length: 16
            key_length: 32

      access_control:
        default_policy: two_factor

      session:
        name: sandbox_session
        secret: 'CHANGE_ME_SETUP_WIZARD_WILL_REPLACE_THIS'
        cookies:
          - domain: 'circlescorner.xyz'
            authelia_url: 'https://circlescorner.xyz/authelia'
            default_redirection_url: 'https://circlescorner.xyz'

      regulation:
        max_retries: 3
        find_time: 2m
        ban_time: 5m

      storage:
        local:
          path: /config/db.sqlite3

      notifier:
        filesystem:
          filename: /config/notifications.txt

  # ---- Authelia users (placeholder — setup wizard will replace) ----
  - path: /opt/sandbox/authelia/users.yml
    content: |
      # This file will be replaced by the setup wizard
      # Temporary placeholder to allow Authelia to start
      users:
        setup:
          displayname: "Setup Wizard"
          email: setup@circlescorner.xyz
          password: "$argon2id$v=19$m=65536,t=3,p=4$PLACEHOLDER"
          groups:
            - admins

  # ---- Core docker-compose (Caddy + Authelia + Dashboard) ----
  - path: /opt/sandbox/docker-compose.yml
    content: |
      services:
        caddy:
          image: ghcr.io/caddyserver/caddy:2
          restart: unless-stopped
          ports:
            - "80:80"
            - "443:443"
            - "443:443/udp"
          volumes:
            - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
            - caddy_data:/data
            - caddy_config:/config
          networks:
            - frontend

        authelia:
          image: authelia/authelia:latest
          restart: unless-stopped
          volumes:
            - ./authelia:/config
          environment:
            TZ: America/Chicago
          networks:
            - frontend

        dashboard:
          build: ./dashboard
          restart: unless-stopped
          volumes:
            - /var/run/docker.sock:/var/run/docker.sock:ro
            - /opt/sandbox:/opt/sandbox:ro
          environment:
            DO_TOKEN: "CHANGE_ME_SETUP_WIZARD_WILL_SET_THIS"
            DOMAIN: "circlescorner.xyz"
            VPC_SUBNET: "10.100.0.0/16"
            FLASK_ENV: "production"
          networks:
            - frontend
            - sandbox

      networks:
        frontend:
          name: sandbox_frontend
        sandbox:
          name: sandbox_net
          driver: bridge
          ipam:
            config:
              - subnet: 172.30.0.0/24

      volumes:
        caddy_data:
        caddy_config:

  # ---- Sandbox containers compose ----
  - path: /opt/sandbox/sandbox/docker-compose.yml
    content: |
      services:
        box1:
          image: ubuntu:24.04
          container_name: sandbox-box1
          hostname: box1
          command: sleep infinity
          restart: unless-stopped
          labels:
            sandbox.role: "general"
            sandbox.slot: "1"
          networks:
            sandbox_net:
              ipv4_address: 172.30.0.11

        box2:
          image: ubuntu:24.04
          container_name: sandbox-box2
          hostname: box2
          command: sleep infinity
          restart: unless-stopped
          labels:
            sandbox.role: "general"
            sandbox.slot: "2"
          networks:
            sandbox_net:
              ipv4_address: 172.30.0.12

        box3:
          image: ubuntu:24.04
          container_name: sandbox-box3
          hostname: box3
          command: sleep infinity
          restart: unless-stopped
          labels:
            sandbox.role: "general"
            sandbox.slot: "3"
          networks:
            sandbox_net:
              ipv4_address: 172.30.0.13

        box4:
          image: ubuntu:24.04
          container_name: sandbox-box4
          hostname: box4
          command: sleep infinity
          restart: unless-stopped
          labels:
            sandbox.role: "general"
            sandbox.slot: "4"
          networks:
            sandbox_net:
              ipv4_address: 172.30.0.14

      networks:
        sandbox_net:
          external: true

  # ---- README for DO Console users ----
  - path: /opt/sandbox/README-FIRST-BOOT.txt
    content: |
      ====================================================================
      SANDBOX HUB - FIRST BOOT INSTRUCTIONS
      ====================================================================
      
      The system is now ready but ports 80/443 are BLOCKED for security.
      
      STEP 1: Read the setup token
      -----------------------------
      cat /opt/sandbox/setup-token.txt
      
      Copy this token - you'll need it for the setup wizard.
      
      STEP 2: Unlock ports for 2 hours
      ---------------------------------
      systemctl start setup-unlock
      
      This opens ports 80/443 for 2 hours. Complete setup before timeout.
      
      STEP 3: Visit the domain from any browser
      ------------------------------------------
      https://circlescorner.xyz
      
      You'll see the setup wizard. Enter the token from Step 1.
      
      STEP 4: Complete the wizard
      ----------------------------
      - Enter your admin email
      - Set your admin password
      - Provide your DigitalOcean API token
      - (Optional) Enroll Face ID / TOTP
      
      After setup completes, the system is fully secured with Authelia.
      The ports stay open but protected by authentication.
      
      ====================================================================
      
      TROUBLESHOOTING:
      
      Check cloud-init progress:
        tail -f /var/log/cloud-init-output.log
      
      Check system status:
        cat /opt/sandbox/status
        (should say "ready")
      
      Check Docker containers:
        docker ps
        (should show caddy, authelia, dashboard, box1-4)
      
      Check unlock expiration:
        cat /opt/sandbox/unlock-expires-at.txt
      
      Manually unlock again (if timeout expired):
        systemctl start setup-unlock
      
      ====================================================================

runcmd:
  # Enable Docker
  - systemctl enable --now docker

  # UFW: Start LOCKED DOWN (SSH only, ports 80/443 blocked)
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow 22/tcp
  - ufw allow from 10.100.0.0/16
  - ufw --force enable
  - echo "UFW configured: SSH + VPC only. Ports 80/443 BLOCKED until unlock."

  # Generate setup token
  - /opt/sandbox/generate-token.sh

  # Install systemd unlock service
  - systemctl daemon-reload
  - echo "Setup unlock service installed. Use: systemctl start setup-unlock"

  # Clone dashboard code from GitHub (replace with your actual repo)
  # For now, we'll create a minimal setup-aware dashboard
  - mkdir -p /opt/sandbox/dashboard

  # Create minimal dashboard app with setup wizard
  - |
    cat > /opt/sandbox/dashboard/app.py << 'DASHBOARDEOF'
    from flask import Flask, request, render_template_string, redirect, jsonify
    import os
    import hashlib
    import secrets

    app = Flask(__name__)

    SETUP_TOKEN_FILE = '/opt/sandbox/setup-token.txt'
    AUTHELIA_USERS_FILE = '/opt/sandbox/authelia/users.yml'
    AUTHELIA_CONFIG_FILE = '/opt/sandbox/authelia/configuration.yml'

    def is_setup_complete():
        """Check if setup wizard has been completed"""
        return not os.path.exists(SETUP_TOKEN_FILE)

    def validate_setup_token(token):
        """Validate the setup token"""
        if not os.path.exists(SETUP_TOKEN_FILE):
            return False
        with open(SETUP_TOKEN_FILE, 'r') as f:
            valid_token = f.read().strip()
        return token == valid_token

    @app.route('/')
    def index():
        if not is_setup_complete():
            return redirect('/setup')
        return render_template_string('''
            <html>
            <head><title>Sandbox Dashboard</title></head>
            <body style="font-family: sans-serif; max-width: 800px; margin: 50px auto; padding: 20px;">
                <h1>🎉 Sandbox Hub Dashboard</h1>
                <p>Setup complete! You are authenticated via Authelia.</p>
                <p><strong>Phase 1 Status:</strong> Running</p>
                <ul>
                    <li>Caddy: Reverse proxy + HTTPS ✓</li>
                    <li>Authelia: Authentication ✓</li>
                    <li>Dashboard: This app ✓</li>
                    <li>Sandbox containers: box1-box4 ✓</li>
                </ul>
                <hr>
                <h2>Next Steps:</h2>
                <ol>
                    <li>Enroll Face ID: <a href="/authelia">Go to Authelia Settings</a></li>
                    <li>Test container management (coming in next update)</li>
                    <li>Deploy first worker droplet (coming soon)</li>
                </ol>
            </body>
            </html>
        ''')

    @app.route('/setup', methods=['GET', 'POST'])
    def setup():
        if is_setup_complete():
            return redirect('/')
        
        if request.method == 'POST':
            token = request.form.get('token', '').strip()
            email = request.form.get('email', '').strip()
            password = request.form.get('password', '')
            do_token = request.form.get('do_token', '').strip()
            
            # Validate token
            if not validate_setup_token(token):
                return render_template_string(SETUP_TEMPLATE, error="Invalid setup token")
            
            # Validate inputs
            if not email or not password or not do_token:
                return render_template_string(SETUP_TEMPLATE, error="All fields required")
            
            # Generate password hash (argon2id via Docker)
            import subprocess
            hash_cmd = f"docker run --rm authelia/authelia:latest authelia crypto hash generate argon2 --password '{password}'"
            result = subprocess.run(hash_cmd, shell=True, capture_output=True, text=True)
            password_hash = result.stdout.strip().split('\n')[-1]  # Last line is the hash
            
            # Generate JWT secret for Authelia
            jwt_secret = secrets.token_hex(32)
            
            # Update Authelia users.yml
            users_content = f'''users:
      admin:
        displayname: "Admin"
        email: {email}
        password: "{password_hash}"
        groups:
          - admins
    '''
            with open(AUTHELIA_USERS_FILE, 'w') as f:
                f.write(users_content)
            
            # Update Authelia configuration.yml with real JWT secret
            with open(AUTHELIA_CONFIG_FILE, 'r') as f:
                config = f.read()
            config = config.replace('CHANGE_ME_SETUP_WIZARD_WILL_REPLACE_THIS', jwt_secret)
            with open(AUTHELIA_CONFIG_FILE, 'w') as f:
                f.write(config)
            
            # Update docker-compose.yml with DO token
            compose_file = '/opt/sandbox/docker-compose.yml'
            with open(compose_file, 'r') as f:
                compose = f.read()
            compose = compose.replace('CHANGE_ME_SETUP_WIZARD_WILL_SET_THIS', do_token)
            with open(compose_file, 'w') as f:
                f.write(compose)
            
            # Delete setup token (marks setup as complete)
            os.remove(SETUP_TOKEN_FILE)
            
            # Restart Authelia to apply new config
            subprocess.run('cd /opt/sandbox && docker compose restart authelia', shell=True)
            
            # Cancel auto-relock (setup succeeded)
            if os.path.exists('/opt/sandbox/relock-pid.txt'):
                with open('/opt/sandbox/relock-pid.txt', 'r') as f:
                    pid = f.read().strip()
                try:
                    subprocess.run(f'kill {pid}', shell=True)
                except:
                    pass
            
            return render_template_string('''
                <html>
                <head><title>Setup Complete</title></head>
                <body style="font-family: sans-serif; max-width: 600px; margin: 50px auto; padding: 20px;">
                    <h1>✅ Setup Complete!</h1>
                    <p>Your sandbox hub is now secured with Authelia.</p>
                    <p><strong>Next step:</strong> <a href="/authelia">Log in with your credentials</a></p>
                    <hr>
                    <p><small>You will be redirected to Authelia login in 5 seconds...</small></p>
                    <script>setTimeout(() => window.location.href = '/authelia', 5000);</script>
                </body>
                </html>
            ''')
        
        return render_template_string(SETUP_TEMPLATE, error=None)

    SETUP_TEMPLATE = '''
    <html>
    <head>
        <title>Sandbox Hub Setup</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <style>
            body { font-family: sans-serif; max-width: 500px; margin: 50px auto; padding: 20px; }
            input { width: 100%; padding: 10px; margin: 10px 0; box-sizing: border-box; }
            button { width: 100%; padding: 12px; background: #007bff; color: white; border: none; cursor: pointer; }
            button:hover { background: #0056b3; }
            .error { background: #ffebee; color: #c62828; padding: 10px; margin: 10px 0; border-radius: 4px; }
            .info { background: #e3f2fd; color: #1565c0; padding: 10px; margin: 10px 0; border-radius: 4px; }
        </style>
    </head>
    <body>
        <h1>🔧 Sandbox Hub Setup</h1>
        <div class="info">
            <strong>First-time setup wizard</strong><br>
            This wizard runs once to configure your hub.
        </div>
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        <form method="POST">
            <label>Setup Token (from DO Console)</label>
            <input type="text" name="token" placeholder="32-character hex token" required>
            
            <label>Admin Email</label>
            <input type="email" name="email" placeholder="your@email.com" required>
            
            <label>Admin Password</label>
            <input type="password" name="password" placeholder="Strong password" required>
            
            <label>DigitalOcean API Token</label>
            <input type="text" name="do_token" placeholder="dop_v1_..." required>
            
            <button type="submit">Complete Setup</button>
        </form>
        <hr>
        <p><small>
            <strong>Where to find these:</strong><br>
            • Setup token: <code>cat /opt/sandbox/setup-token.txt</code> in DO Console<br>
            • DO API token: <a href="https://cloud.digitalocean.com/account/api/tokens" target="_blank">DO Panel → API → Tokens</a>
        </small></p>
    </body>
    </html>
    '''

    if __name__ == '__main__':
        app.run(host='0.0.0.0', port=8000)
    DASHBOARDEOF

  - |
    cat > /opt/sandbox/dashboard/Dockerfile << 'DOCKERFILEEOF'
    FROM python:3.11-slim
    WORKDIR /app
    RUN pip install flask gunicorn docker python-digitalocean
    COPY app.py .
    CMD ["gunicorn", "--bind", "0.0.0.0:8000", "--workers", "2", "app:app"]
    DOCKERFILEEOF

  - |
    cat > /opt/sandbox/dashboard/requirements.txt << 'REQEOF'
    flask
    gunicorn
    docker
    python-digitalocean
    REQEOF

  # Build and start all services
  - cd /opt/sandbox && docker compose build
  - cd /opt/sandbox && docker compose up -d

  # Start sandbox containers
  - cd /opt/sandbox/sandbox && docker compose up -d

  # Mark ready
  - echo "ready" > /opt/sandbox/status
  - echo "Setup complete. Read /opt/sandbox/README-FIRST-BOOT.txt for next steps."
