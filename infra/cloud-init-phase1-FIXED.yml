#cloud-config
# Phase 1 Cloud-Init - FIXED for YAML syntax
# All quotes properly escaped, no special characters

package_update: true
package_upgrade: true

packages:
  - docker.io
  - docker-compose-v2
  - curl
  - jq
  - git
  - net-tools
  - ufw
  - python3-pip
  - python3-venv

write_files:
  - path: /opt/sandbox/generate-token.sh
    permissions: '0700'
    content: |
      #!/bin/bash
      openssl rand -hex 16 > /opt/sandbox/setup-token.txt
      chmod 600 /opt/sandbox/setup-token.txt
      echo "Setup token generated"

  - path: /etc/systemd/system/setup-unlock.service
    content: |
      [Unit]
      Description=Unlock ports 80/443 for setup (2 hours)
      After=network.target

      [Service]
      Type=oneshot
      ExecStart=/usr/local/bin/setup-unlock.sh
      RemainAfterExit=yes

      [Install]
      WantedBy=multi-user.target

  - path: /usr/local/bin/setup-unlock.sh
    permissions: '0755'
    content: |
      #!/bin/bash
      set -e
      echo "Unlocking ports 80/443 for 2 hours..."
      ufw allow 80/tcp
      ufw allow 443/tcp
      ufw reload
      date -d "+2 hours" --iso-8601=seconds > /opt/sandbox/unlock-expires-at.txt
      echo "Ports unlocked until $(cat /opt/sandbox/unlock-expires-at.txt)"
      echo "Complete setup at https://circlescorner.xyz before this time"
      (sleep 7200 && /usr/local/bin/setup-relock.sh) &
      echo $! > /opt/sandbox/relock-pid.txt

  - path: /usr/local/bin/setup-relock.sh
    permissions: '0755'
    content: |
      #!/bin/bash
      if [ -f /opt/sandbox/setup-token.txt ]; then
        echo "Setup not completed - re-locking ports"
        ufw delete allow 80/tcp
        ufw delete allow 443/tcp
        ufw reload
      else
        echo "Setup completed - keeping ports open"
      fi

  - path: /opt/sandbox/caddy/Caddyfile
    content: |
      {
        email your-email@example.com
      }

      circlescorner.xyz {
        route /authelia/* {
          reverse_proxy authelia:9091
        }

        route /api/authz/* {
          reverse_proxy authelia:9091
        }

        route /* {
          forward_auth authelia:9091 {
            uri /api/authz/forward-auth
            copy_headers Remote-User Remote-Groups Remote-Name Remote-Email
          }
          reverse_proxy dashboard:8000
        }
      }

      *.circlescorner.xyz {
        forward_auth authelia:9091 {
          uri /api/authz/forward-auth
          copy_headers Remote-User Remote-Groups Remote-Name Remote-Email
        }
        reverse_proxy dashboard:8000
      }

  - path: /opt/sandbox/authelia/configuration.yml
    content: |
      theme: dark
      server:
        address: 'tcp://:9091'

      log:
        level: info

      totp:
        issuer: circlescorner.xyz
        period: 30
        skew: 1

      webauthn:
        disable: false
        display_name: CirclesCorner
        attestation_conveyance_preference: indirect
        user_verification: preferred
        timeout: 60s

      authentication_backend:
        file:
          path: /config/users.yml
          password:
            algorithm: argon2id
            iterations: 3
            memory: 65536
            parallelism: 4
            salt_length: 16
            key_length: 32

      access_control:
        default_policy: two_factor

      session:
        name: sandbox_session
        secret: 'CHANGE_ME_SETUP_WIZARD_WILL_REPLACE_THIS'
        cookies:
          - domain: 'circlescorner.xyz'
            authelia_url: 'https://circlescorner.xyz/authelia'
            default_redirection_url: 'https://circlescorner.xyz'

      regulation:
        max_retries: 3
        find_time: 2m
        ban_time: 5m

      storage:
        local:
          path: /config/db.sqlite3

      notifier:
        filesystem:
          filename: /config/notifications.txt

  - path: /opt/sandbox/authelia/users.yml
    content: |
      users:
        setup:
          displayname: "Setup Wizard"
          email: setup@circlescorner.xyz
          password: "$argon2id$v=19$m=65536,t=3,p=4$PLACEHOLDER"
          groups:
            - admins

  - path: /opt/sandbox/docker-compose.yml
    content: |
      services:
        caddy:
          image: ghcr.io/caddyserver/caddy:2
          restart: unless-stopped
          ports:
            - "80:80"
            - "443:443"
            - "443:443/udp"
          volumes:
            - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
            - caddy_data:/data
            - caddy_config:/config
          networks:
            - frontend

        authelia:
          image: authelia/authelia:latest
          restart: unless-stopped
          volumes:
            - ./authelia:/config
          environment:
            TZ: America/Chicago
          networks:
            - frontend

        dashboard:
          build: ./dashboard
          restart: unless-stopped
          volumes:
            - /var/run/docker.sock:/var/run/docker.sock:ro
            - /opt/sandbox:/opt/sandbox:ro
          environment:
            DO_TOKEN: "CHANGE_ME_SETUP_WIZARD_WILL_SET_THIS"
            DOMAIN: "circlescorner.xyz"
            VPC_SUBNET: "10.100.0.0/16"
            FLASK_ENV: "production"
          networks:
            - frontend
            - sandbox

      networks:
        frontend:
          name: sandbox_frontend
        sandbox:
          name: sandbox_net
          driver: bridge
          ipam:
            config:
              - subnet: 172.30.0.0/24

      volumes:
        caddy_data:
        caddy_config:

  - path: /opt/sandbox/sandbox/docker-compose.yml
    content: |
      services:
        box1:
          image: ubuntu:24.04
          container_name: sandbox-box1
          hostname: box1
          command: sleep infinity
          restart: unless-stopped
          labels:
            sandbox.role: "general"
            sandbox.slot: "1"
          networks:
            sandbox_net:
              ipv4_address: 172.30.0.11

        box2:
          image: ubuntu:24.04
          container_name: sandbox-box2
          hostname: box2
          command: sleep infinity
          restart: unless-stopped
          labels:
            sandbox.role: "general"
            sandbox.slot: "2"
          networks:
            sandbox_net:
              ipv4_address: 172.30.0.12

        box3:
          image: ubuntu:24.04
          container_name: sandbox-box3
          hostname: box3
          command: sleep infinity
          restart: unless-stopped
          labels:
            sandbox.role: "general"
            sandbox.slot: "3"
          networks:
            sandbox_net:
              ipv4_address: 172.30.0.13

        box4:
          image: ubuntu:24.04
          container_name: sandbox-box4
          hostname: box4
          command: sleep infinity
          restart: unless-stopped
          labels:
            sandbox.role: "general"
            sandbox.slot: "4"
          networks:
            sandbox_net:
              ipv4_address: 172.30.0.14

      networks:
        sandbox_net:
          external: true

  - path: /opt/sandbox/README-FIRST-BOOT.txt
    content: |
      SANDBOX HUB - FIRST BOOT INSTRUCTIONS
      
      The system is ready but ports 80/443 are BLOCKED for security.
      
      STEP 1 - Read the setup token
      cat /opt/sandbox/setup-token.txt
      
      STEP 2 - Unlock ports for 2 hours
      systemctl start setup-unlock
      
      STEP 3 - Visit the domain
      https://circlescorner.xyz
      
      STEP 4 - Complete the setup wizard
      Enter the token from Step 1
      
      TROUBLESHOOTING
      Check status - cat /opt/sandbox/status
      Check containers - docker ps
      Check unlock time - cat /opt/sandbox/unlock-expires-at.txt

  - path: /opt/sandbox/dashboard/app.py
    content: |
      from flask import Flask, request, render_template_string, redirect
      import os
      import subprocess
      import secrets

      app = Flask(__name__)

      SETUP_TOKEN_FILE = '/opt/sandbox/setup-token.txt'
      AUTHELIA_USERS_FILE = '/opt/sandbox/authelia/users.yml'
      AUTHELIA_CONFIG_FILE = '/opt/sandbox/authelia/configuration.yml'

      def is_setup_complete():
          return not os.path.exists(SETUP_TOKEN_FILE)

      def validate_setup_token(token):
          if not os.path.exists(SETUP_TOKEN_FILE):
              return False
          with open(SETUP_TOKEN_FILE, 'r') as f:
              valid_token = f.read().strip()
          return token == valid_token

      @app.route('/')
      def index():
          if not is_setup_complete():
              return redirect('/setup')
          return '''
              <html>
              <head><title>Sandbox Dashboard</title></head>
              <body style="font-family: sans-serif; max-width: 800px; margin: 50px auto; padding: 20px;">
                  <h1>Sandbox Hub Dashboard</h1>
                  <p>Setup complete! You are authenticated via Authelia.</p>
                  <p><strong>Phase 1 Status:</strong> Running</p>
                  <ul>
                      <li>Caddy: Reverse proxy + HTTPS [OK]</li>
                      <li>Authelia: Authentication [OK]</li>
                      <li>Dashboard: This app [OK]</li>
                      <li>Sandbox containers: box1-box4 [OK]</li>
                  </ul>
                  <hr>
                  <h2>Next Steps:</h2>
                  <ol>
                      <li>Enroll Face ID: <a href="/authelia">Go to Authelia Settings</a></li>
                      <li>Test container management (coming soon)</li>
                      <li>Deploy worker droplet (coming soon)</li>
                  </ol>
              </body>
              </html>
          '''

      @app.route('/setup', methods=['GET', 'POST'])
      def setup():
          if is_setup_complete():
              return redirect('/')
          
          if request.method == 'POST':
              token = request.form.get('token', '').strip()
              email = request.form.get('email', '').strip()
              password = request.form.get('password', '')
              do_token = request.form.get('do_token', '').strip()
              
              if not validate_setup_token(token):
                  return render_template_string(SETUP_TEMPLATE, error="Invalid setup token")
              
              if not email or not password or not do_token:
                  return render_template_string(SETUP_TEMPLATE, error="All fields required")
              
              hash_cmd = f"docker run --rm authelia/authelia:latest authelia crypto hash generate argon2 --password '{password}'"
              result = subprocess.run(hash_cmd, shell=True, capture_output=True, text=True)
              password_hash = result.stdout.strip().split('\n')[-1]
              
              jwt_secret = secrets.token_hex(32)
              
              users_content = f'''users:
        admin:
          displayname: "Admin"
          email: {email}
          password: "{password_hash}"
          groups:
            - admins
      '''
              with open(AUTHELIA_USERS_FILE, 'w') as f:
                  f.write(users_content)
              
              with open(AUTHELIA_CONFIG_FILE, 'r') as f:
                  config = f.read()
              config = config.replace('CHANGE_ME_SETUP_WIZARD_WILL_REPLACE_THIS', jwt_secret)
              with open(AUTHELIA_CONFIG_FILE, 'w') as f:
                  f.write(config)
              
              compose_file = '/opt/sandbox/docker-compose.yml'
              with open(compose_file, 'r') as f:
                  compose = f.read()
              compose = compose.replace('CHANGE_ME_SETUP_WIZARD_WILL_SET_THIS', do_token)
              with open(compose_file, 'w') as f:
                  f.write(compose)
              
              os.remove(SETUP_TOKEN_FILE)
              
              subprocess.run('cd /opt/sandbox && docker compose restart authelia', shell=True)
              
              if os.path.exists('/opt/sandbox/relock-pid.txt'):
                  with open('/opt/sandbox/relock-pid.txt', 'r') as f:
                      pid = f.read().strip()
                  try:
                      subprocess.run(f'kill {pid}', shell=True)
                  except:
                      pass
              
              return '''
                  <html>
                  <head><title>Setup Complete</title></head>
                  <body style="font-family: sans-serif; max-width: 600px; margin: 50px auto; padding: 20px;">
                      <h1>Setup Complete!</h1>
                      <p>Your sandbox hub is now secured with Authelia.</p>
                      <p><strong>Next:</strong> <a href="/authelia">Log in with your credentials</a></p>
                      <hr>
                      <p><small>Redirecting in 5 seconds...</small></p>
                      <script>setTimeout(() => window.location.href = '/authelia', 5000);</script>
                  </body>
                  </html>
              '''
          
          return render_template_string(SETUP_TEMPLATE, error=None)

      SETUP_TEMPLATE = '''
      <html>
      <head>
          <title>Sandbox Hub Setup</title>
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <style>
              body { font-family: sans-serif; max-width: 500px; margin: 50px auto; padding: 20px; }
              input { width: 100%; padding: 10px; margin: 10px 0; box-sizing: border-box; }
              button { width: 100%; padding: 12px; background: #007bff; color: white; border: none; cursor: pointer; }
              button:hover { background: #0056b3; }
              .error { background: #ffebee; color: #c62828; padding: 10px; margin: 10px 0; border-radius: 4px; }
              .info { background: #e3f2fd; color: #1565c0; padding: 10px; margin: 10px 0; border-radius: 4px; }
          </style>
      </head>
      <body>
          <h1>Sandbox Hub Setup</h1>
          <div class="info">
              <strong>First-time setup wizard</strong><br>
              This runs once to configure your hub.
          </div>
          {% if error %}
          <div class="error">{{ error }}</div>
          {% endif %}
          <form method="POST">
              <label>Setup Token (from DO Console)</label>
              <input type="text" name="token" placeholder="32-character hex token" required>
              
              <label>Admin Email</label>
              <input type="email" name="email" placeholder="your@email.com" required>
              
              <label>Admin Password</label>
              <input type="password" name="password" placeholder="Strong password" required>
              
              <label>DigitalOcean API Token</label>
              <input type="text" name="do_token" placeholder="dop_v1_..." required>
              
              <button type="submit">Complete Setup</button>
          </form>
          <hr>
          <p><small>
              <strong>Where to find:</strong><br>
              Setup token: cat /opt/sandbox/setup-token.txt<br>
              DO API token: cloud.digitalocean.com/account/api/tokens
          </small></p>
      </body>
      </html>
      '''

      if __name__ == '__main__':
          app.run(host='0.0.0.0', port=8000)

  - path: /opt/sandbox/dashboard/Dockerfile
    content: |
      FROM python:3.11-slim
      WORKDIR /app
      RUN pip install flask gunicorn docker python-digitalocean
      COPY app.py .
      CMD ["gunicorn", "--bind", "0.0.0.0:8000", "--workers", "2", "app:app"]

  - path: /opt/sandbox/dashboard/requirements.txt
    content: |
      flask
      gunicorn
      docker
      python-digitalocean

runcmd:
  - systemctl enable --now docker
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow 22/tcp
  - ufw allow from 10.100.0.0/16
  - ufw --force enable
  - echo "UFW configured"
  - /opt/sandbox/generate-token.sh
  - systemctl daemon-reload
  - echo "Setup unlock service ready"
  - mkdir -p /opt/sandbox/dashboard
  - cd /opt/sandbox && docker compose build
  - cd /opt/sandbox && docker compose up -d
  - cd /opt/sandbox/sandbox && docker compose up -d
  - echo "ready" > /opt/sandbox/status
  - echo "Deployment complete"
