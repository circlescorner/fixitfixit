#cloud-config
package_update: true
package_upgrade: true

packages:
  - docker.io
  - docker-compose-v2
  - curl
  - jq
  - net-tools
  - ufw

runcmd:
  # Enable Docker
  - systemctl enable --now docker

  # UFW — allow SSH + VPC traffic
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow 22/tcp
  - ufw allow from ${vpc_subnet}
  - ufw --force enable

  # Add route awareness for hub
  - echo "${hub_ip} sandbox-hub" >> /etc/hosts

  # Signal that this worker is ready (hub can poll this)
  - mkdir -p /opt/sandbox
  - echo "ready" > /opt/sandbox/status
